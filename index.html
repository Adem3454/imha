<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bomba İmha</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;padding:16px;background:#2b2f2a;color:#ece8d8;font:16px/1.45 Georgia,serif}
h1{font-size:30px;margin:12px 0}
h3{margin:14px 0 4px;font-size:16px}
button,input{font:inherit}
.b{background:#d9a441;color:#1d1d16;border:0;padding:12px 18px;border-radius:4px;font-weight:700;margin:4px 0}
input{padding:11px;border-radius:4px;border:2px solid #6b7266;background:#1f221e;color:#fff;width:110px;text-transform:uppercase;font-size:20px;text-align:center}
.card{background:#3a4038;border:2px solid #55604f;border-radius:4px;padding:14px;margin:12px 0}
.man{background:#e9e2cc;color:#2a2a22;border-color:#bdb391}
.man li{margin:6px 0}.man p{margin:6px 0}
#top{display:flex;justify-content:space-between;align-items:center}
#clock{font:700 44px ui-monospace,Menlo,Consolas,monospace;color:#ff6b2c;background:#15120e;padding:2px 14px;border-radius:4px}
.ser{font:700 30px ui-monospace,Menlo,Consolas,monospace}
.wire{display:block;width:100%;height:20px;border:0;border-radius:10px;margin:14px 0}
.cut{opacity:.2}
.big{width:130px;height:130px;border-radius:50%;border:6px solid #1d1d16;color:#fff;font-size:20px;font-weight:700;text-shadow:0 0 4px #000,0 1px 6px #000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.big.on{transform:scale(.94)}
.k{font-size:32px;width:62px;height:62px;margin:4px;border-radius:4px;border:2px solid #1d1d16;background:#cfc8b0;color:#1d1d16}
.k.on{background:#7bc47f}
.end{font-size:20px;font-weight:700}
.sym{font-size:22px;letter-spacing:.2em}
body{background:radial-gradient(ellipse at 50% 25%,#3d4638,#1a1d18 75%) fixed}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
h1{font-size:36px;text-shadow:0 0 20px rgba(255,107,44,.55)}
.card{background:rgba(44,50,42,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.man{background:rgba(233,226,204,.96)}
#clock{text-shadow:0 0 14px #ff6b2c;box-shadow:inset 0 0 12px #000}
#clock.low{animation:blink 1s steps(2) infinite}
.wire{background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 45%,rgba(0,0,0,.45));box-shadow:0 4px 6px rgba(0,0,0,.5)}
.cut{opacity:.7;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%)}
.big{background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),rgba(255,255,255,0) 45%,rgba(0,0,0,.4));box-shadow:0 8px 0 #1d1d16,0 16px 20px rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s}
.big.on{transform:translateY(6px);box-shadow:0 2px 0 #1d1d16,0 4px 8px rgba(0,0,0,.6)}
.k{box-shadow:0 4px 0 #8c846a}.k:active{transform:translateY(3px);box-shadow:0 1px 0 #8c846a}
.k.on{background:#7bc47f;box-shadow:0 0 16px #7bc47f}
#flash{position:fixed;inset:0;pointer-events:none;z-index:5}
#flash.hit{animation:hit .6s ease-out}
#flash.blast{animation:blast 1.6s ease-out forwards}
#flash.won{animation:won 1.2s ease-out}
.in{animation:drop .7s cubic-bezier(.2,.8,.2,1)}
.sh{animation:sh .45s}
@keyframes blink{50%{opacity:.35}}
@keyframes hit{from{box-shadow:inset 0 0 140px 50px rgba(255,40,20,.75)}to{box-shadow:inset 0 0 0 0 rgba(255,40,20,0)}}
@keyframes won{from{box-shadow:inset 0 0 160px 60px rgba(80,255,130,.6)}to{box-shadow:inset 0 0 0 0 rgba(80,255,130,0)}}
@keyframes blast{0%{background:#fff}15%{background:#ff8c3a}100%{background:rgba(120,20,0,.45)}}
@keyframes drop{from{opacity:0;transform:perspective(800px) rotateX(28deg) translateY(40px)}}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
</style></head><body><div id="flash"></div><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const COL={r:'#d63c3c',b:'#2f6fd6',y:'#e8c22e',w:'#f1efe6'};
const SYM=[['★','☾','♠','♣','♥','♦'],['✿','☂','☎','✂','⚑','♫'],['☢','☯','✈','⚓','☠','✉']];
const LAB=['İPTAL','TUT','BAS','DUR'];
let peer,conn,host=false,S=null,recv=0,round=0;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const fmt=l=>{const s=Math.ceil(l/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const left=()=>S.run?S.left-(Date.now()-recv)*(1+.25*S.st):S.left;

/* Çözüm kuralları: kılavuzdaki metinle birebir aynı olmalı */
const wireSol=(w,odd,bat,ind)=>{const c=x=>w.filter(y=>y==x).length;
 if(bat>=2&&ind.on&&ind.n!='SES')return 3;
 if(c('r')>1&&odd)return w.lastIndexOf('r');
 if(w[3]=='y'&&!c('r'))return 0;
 if(c('b')==1)return 0;
 if(c('y')>1)return 3;
 return 1};
const btnSol=(b,d)=>(b.l=='İPTAL'||b.c=='r')?'tap':d;

/* Bağlantı */
function lobby(m){$('app').innerHTML=`<h1>Bomba İmha</h1><p>İki kişilik, uzaktan. Oyun sırasında sesli arama açık olsun.</p>
<div class="card"><button class="b" onclick="mk()">Oda kur</button></div>
<div class="card">Oda kodu <input id="code" maxlength="4"> <button class="b" onclick="jn()">Katıl</button></div><p>${m||''}</p>`}
function hook(c){
 c.on('data',d=>{if(d.s){S=d.s;recv=Date.now();draw()}if(d.a&&host)apply(d.a)});
 c.on('close',()=>{$('app').innerHTML='<h1>Bağlantı koptu</h1><button class="b" onclick="location.reload()">Başa dön</button>'})}
function mk(){
 const code=Array.from({length:4},()=>pick('ABCDEFGHJKLMNPQRSTUVWXYZ23456789')).join('');
 host=true;peer=new Peer('bmb-'+code);
 peer.on('open',()=>$('app').innerHTML=`<h1>Bomba İmha</h1><div class="card">Oda kodu<div class="ser">${code}</div>Bu kodu arkadaşına gönder. Katılmasını bekliyorum.</div>`);
 peer.on('connection',c=>{if(conn)return c.close();conn=c;hook(c);c.on('open',()=>{round=0;newRound()})});
 peer.on('error',e=>e.type=='unavailable-id'?mk():lobby('Bağlantı hatası: '+e.type))}
function jn(){
 const code=$('code').value.trim().toUpperCase();if(code.length!=4)return;
 host=false;peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('bmb-'+code,{reliable:true});hook(conn)});
 peer.on('error',e=>lobby(e.type=='peer-unavailable'?'Oda bulunamadı. Kodu kontrol et.':'Bağlantı hatası: '+e.type))}

/* Oyun mantığı (sadece oda sahibinde çalışır) */
function newRound(){
 round++;
 const col=rnd(3),idx=shuffle([0,1,2,3,4,5]).slice(0,4).sort(),sol=idx.map(i=>SYM[col][i]),L='ABCDEFGHJKLMNPRSTUXYZ';
 S={round,dc:round%2?'h':'g',ser:pick(L)+pick(L)+'-'+(1000+rnd(9000)),
  w:Array.from({length:4},()=>pick('rbyw')),cut:[0,0,0,0],btn:{c:pick('rbyw'),l:pick(LAB)},
  k:{show:shuffle(sol),sol,n:0},bat:rnd(5),ind:{n:pick(['KRK','SES','FRK']),on:rnd(2)},lp:Array.from({length:4},()=>rnd(2)),sw:[0,0,0,0],ok:{w:0,b:0,k:0,s:0},st:0,left:300000,run:1,res:''};
 recv=Date.now();sync()}
function sync(){conn.send({s:S});draw()}
function act(a){host?apply(a):conn.send({a})}
function apply(a){
 if(!S.run)return;
 S.left=Math.max(0,left());recv=Date.now();
 const d=+S.ser.slice(-1),bad=()=>{if(++S.st>=3){S.run=0;S.res='boom'}};
 if(a.t=='w'&&!S.cut[a.i]&&!S.ok.w){S.cut[a.i]=1;a.i==wireSol(S.w,d%2,S.bat,S.ind)?S.ok.w=1:bad()}
 if(a.t=='b'&&!S.ok.b)a.v==btnSol(S.btn,d)?S.ok.b=1:bad();
 if(a.t=='k'&&!S.ok.k){
  if(S.k.show[a.i]==S.k.sol[S.k.n]){if(++S.k.n==4)S.ok.k=1}else{S.k.n=0;bad()}}
 if(a.t=='s'&&!S.ok.s)S.sw[a.i]^=1;
 if(a.t=='sc'&&!S.ok.s)swSol(S.lp,d%2).join()==S.sw.join()?S.ok.s=1:bad();
 if(S.run&&S.ok.w&&S.ok.b&&S.ok.k&&S.ok.s){S.run=0;S.res='win'}
 sync()}
setInterval(()=>{if(!S)return;const l=left(),c=$('clock');
 if(c){c.textContent=fmt(Math.max(0,l));c.classList.toggle('low',!!S.run&&l<30000)}tickFx(l);
 if(host&&S.run&&l<=0){S.run=0;S.left=0;S.res='boom';sync()}},200);

/* Arayüz */
function draw(){
 fx();
 const def=S.dc==(host?'h':'g');
 let h=`<div id="top"><div>Tur ${S.round} · Hata: ${S.st}/3</div><div id="clock">${fmt(Math.max(0,left()))}</div></div>
 <p>${def?'Bomba uzmanısın. Bombayı sen görüyorsun, arkadaşına tarif et.':'Kılavuzdasın. Bombayı göremezsin, arkadaşını kılavuzla yönlendir.'}</p>`;
 if(!S.run)h+=`<div class="card end">${S.res=='win'?'Bomba etkisiz hale getirildi!':'Bomba patladı.'}</div>`+
  (host?'<button class="b" onclick="newRound()">Yeni tur (roller değişir)</button>':'<p>Yeni turu oda sahibi başlatır.</p>');
 $('app').innerHTML=h+(def?bomb():manual());
 stage();const bt=$('bt');if(bt){let t0=0;
  bt.oncontextmenu=e=>e.preventDefault();
  bt.onpointerdown=e=>{t0=Date.now();bt.setPointerCapture(e.pointerId);bt.classList.add('on')};
  bt.onpointerup=bt.onpointercancel=()=>{if(!t0)return;const d=Date.now()-t0;t0=0;bt.classList.remove('on');
   act({t:'b',v:d<500?'tap':Math.ceil(left()/1000)%10})}}}
function bomb(){
 const ck=x=>x?'✔ ':'';
 return `<div class="card">Seri no<div class="ser">${S.ser}</div></div>
 <div class="card">${ck(S.ok.w)}Kablolar (soldan sağa sırayla)`+S.w.map((c,i)=>`<button class="wire${S.cut[i]?' cut':''}" style="background-color:${COL[c]}" onclick="act({t:'w',i:${i}})"></button>`).join('')+`</div>
 <div class="card">${ck(S.ok.b)}Düğme<br><button id="bt" class="big" style="background-color:${COL[S.btn.c]}">${S.btn.l}</button></div>
 <div class="card">${ck(S.ok.k)}Semboller<br>`+S.k.show.map((s,i)=>`<button class="k${S.k.sol.slice(0,S.k.n).includes(s)?' on':''}" onclick="act({t:'k',i:${i}})">${s}</button>`).join('')+`</div>`}
function manual(){
 return `<div class="card man"><h3>Bomba imha kılavuzu</h3>
 <p>Bombanın ön yüzünde kablolar, düğme, semboller, şalterler ve lambalar var. Arka yüzünde seri no, piller ve gösterge lambası (KRK, SES ya da FRK; yanık ya da sönük) bulunur. Arkadaşından bombayı çevirmesini iste. Her hata saati biraz hızlandırır.</p>
 <h3>1. Kablolar</h3><p>4 kablo var. Kuralları sırayla dene, ilk uyan kural geçerli.</p><ol>
 <li>Pil sayısı 2 veya daha fazla ve SES dışındaki gösterge lambası yanıksa: son kabloyu kes.</li><li>Birden fazla kırmızı kablo var ve seri no son rakamı tekse: son kırmızı kabloyu kes.</li>
 <li>Son kablo sarı ve hiç kırmızı kablo yoksa: ilk kabloyu kes.</li>
 <li>Tam olarak bir mavi kablo varsa: ilk kabloyu kes.</li>
 <li>Birden fazla sarı kablo varsa: son kabloyu kes.</li>
 <li>Hiçbiri uymazsa: ikinci kabloyu kes.</li></ol>
 <h3>2. Düğme</h3><ol>
 <li>Yazı İPTAL ise: hızlıca bas ve bırak (yarım saniyeden kısa).</li>
 <li>Düğme kırmızıysa: hızlıca bas ve bırak.</li>
 <li>Diğer durumlarda: basılı tut. Sayaçtaki saniyenin son hanesi seri no son rakamına eşit olduğunda bırak. Örnek: seri no 5 ile bitiyorsa 2:35, 2:25 gibi anlarda bırak.</li></ol>
 <h3>3. Şalterler</h3><p>4 şalter ve üstlerinde 4 lamba var, şalterlerin hepsi aşağıda başlar. Her şalter kendisinin sağındaki lambaya bakar (4. şalter için 1. lamba). O lamba yanıyorsa şalter yukarıda, sönükse aşağıda olmalı. Seri no son rakamı tekse bütün sonuçları tersine çevir. Ayarlayınca ONAY tuşuna bas.</p><h3>4. Semboller</h3><p>Bombadaki 4 sembol aşağıdaki satırlardan yalnızca birinde bulunur. O satırı bul, sembollere o satırdaki soldan sağa sırayla bastır.</p>
 ${SYM.map(c=>`<div class="sym">${c.join(' ')}</div>`).join('')}</div>`}
/* Ses */
let ac;
addEventListener('pointerdown',()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()});
function snd(f,d,type,v,to){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function noise(d,v){if(!ac)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start()}
let ls=-1,P={};
function tickFx(l){if(!S||!S.run)return;const s=Math.ceil(l/1000);if(s!=ls){ls=s;snd(s<=30?1300:900,.05,'square',.05);T&&T.pulse()}}
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
function anim(c){const a=$('app');a.classList.remove('in','sh');void a.offsetWidth;a.classList.add(c)}
function pop(c){const e=$('flash');e.className='';void e.offsetWidth;e.className=c}
function fx(){
 const c=S.cut.reduce((a,b)=>a+b)+S.sw.reduce((a,b)=>a+b),o=S.ok.w+S.ok.b+S.ok.k+S.ok.s;
 if(P.r!=S.round){T&&T.reset();pop('');anim('in')}
 else if(P.run&&!S.run){
  if(S.res=='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.3,'sine',.12),i*120));T&&T.win();pop('won')}
  else{noise(1.4,.5);snd(90,.9,'sawtooth',.3,30);vib([300,100,500]);T&&T.boom();pop('blast');anim('sh')}}
 else if(S.st>P.st){snd(170,.45,'sawtooth',.14,70);vib(200);T&&T.strike();pop('hit');anim('sh')}
 else if(c!=P.c)noise(.1,.25);
 else if(o>P.o||S.k.n>P.n){snd(880,.12,'sine',.12);setTimeout(()=>snd(1320,.15,'sine',.1),90)}
 P={r:S.round,run:S.run,st:S.st,c,o,n:S.k.n}}

/* 3D bomba sahnesi (arka plan) */
let T=null;
function init3d(){
 const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,50),g=new THREE.Group(),bm=new THREE.Group();
 r.setPixelRatio(Math.min(devicePixelRatio,2));r.domElement.id='gl';document.body.prepend(r.domElement);
 sc.add(g);g.add(bm);
 r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 sc.background=new THREE.Color(0x12150f);sc.fog=new THREE.FogExp2(0x12150f,.035);
 {const es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,30),new THREE.MeshBasicMaterial({color:0x1a1d17,side:THREE.BackSide})));
  [[0,12,0,16,.3,6,1.6],[-12,2,4,.3,10,10,1],[12,0,-4,.3,8,8,.8]].forEach(([x,y,z,w,h,d,i])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:new THREE.Color(i,i*.95,i*.85)}));m.position.set(x,y,z);es.add(m)});
  sc.environment=new THREE.PMREMGenerator(r).fromScene(es,.04).texture}
 const M=(c,m,ro)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:ro}),dark=M(0x4a5056,.7,.45);
 const add=(geo,mat,x,y,z,rz)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.rotation.z=rz||0;bm.add(m);return m};
 add(new THREE.SphereGeometry(1.7,48,32),dark);
 add(new THREE.TorusGeometry(1.72,.09,12,64),M(0xd9a441,.9,.3)).rotation.x=Math.PI/2;
 add(new THREE.CylinderGeometry(.35,.45,.4,20),dark,0,1.8);
 add(new THREE.CylinderGeometry(.05,.05,.9,8),M(0xc9b88a,0,.9),.25,2.35,0,-.5);
 sc.add(new THREE.HemisphereLight(0xbfc8d8,0x222018,.55));
 const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(3,4,5);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);dl.shadow.bias=-.0005;sc.add(dl);
 const pl=new THREE.PointLight(0xff3b1f,1,12);pl.position.set(0,0,3.5);sc.add(pl);
 const N=260,sp=new Float32Array(N*3),sv=[],spg=new THREE.BufferGeometry();
 for(let i=0;i<N;i++)sv.push({l:Math.random(),x:0,y:0,z:0});
 spg.setAttribute('position',new THREE.BufferAttribute(sp,3));
 bm.add(new THREE.Points(spg,new THREE.PointsMaterial({size:.09,color:0xffb347,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));
 const NB=2500,bp=new Float32Array(NB*3),bv=[],bg=new THREE.BufferGeometry();
 for(let i=0;i<NB;i++)bv.push(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*5));
 bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
 const bmat=new THREE.PointsMaterial({size:.14,color:0xff8c3a,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
 sc.add(new THREE.Points(bg,bmat));
 let shake=0,pulse=0,flash=0,bt=-1;
 T={pulse(){pulse=1},strike(){shake=.6;flash=1},
  boom(){bm.visible=false;bt=0;flash=3;bmat.opacity=1;ring.material.opacity=1;ring.scale.setScalar(1)},
  win(){dark.emissive.setHex(0x14803a);pl.color.setHex(0x3cff7a);flash=1.5},
  reset(){ft=0;bm.visible=true;bt=-1;bmat.opacity=0;ring.material.opacity=0;dark.emissive.setHex(0);pl.color.setHex(0xff3b1f);flash=0}};
 /* Etkileşimli 3D bomba paneli */
 const panel=new THREE.Group();sc.add(panel);let pk=[],btn=null;
 const tex=(t,w,h,fg,bg,fs)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}x.fillStyle=fg;x.font='bold '+fs+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,w/2,h/2);return new THREE.CanvasTexture(c)};
 const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d),col=(c,e)=>new THREE.MeshStandardMaterial({color:c,metalness:.05,roughness:.65,envMapIntensity:.5,emissive:e||0}),ghost=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
